[package]
name = "memorija"
version = "0.2.0"
edition = "2024"
description = "MCP server providing persistent file-based memory through Anthropic's memory tool interface"
license = "Apache-2.0"

[dependencies]
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
termimad = "0.35.5"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
rmcp = { version = "3.8.0", features = ["client", "transport-streamable-http-client-reqwest"] }
