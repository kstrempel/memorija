<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memorija</title>
<style>
  :root {
    --border: #ddd;
    --muted: #777;
    --accent: #0b62d6;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0 auto;
    max-width: 52rem;
    padding: 1rem;
    color: #222;
    background: #fff;
  }
  h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  #feed { border: 1px solid var(--border); border-radius: 6px; margin: 0.75rem 0 1.5rem; }
  .row {
    display: flex;
    gap: 0.75rem;
    padding: 0.4rem 0.75rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--bg); }
  .row.selected { background: var(--bg); }
  .row .when { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .file { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .row .cause { color: var(--muted); }
  .row .size { color: var(--muted); white-space: nowrap; }
  .size .added { color: #1a7f37; }
  .size .removed { color: #cf222e; }
  #empty { padding: 0.75rem; }
  #content { border-top: 1px solid var(--border); padding-top: 1rem; }
  #file-body { line-height: 1.5; }
  #file-body pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem;
    overflow-x: auto;
  }
  #file-body code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
  #file-body table { border-collapse: collapse; }
  #file-body table td, #file-body table th { border: 1px solid var(--border); padding: 0.2rem 0.5rem; }
  .error { color: #cf222e; }
</style>
</head>
<body>
<h1>memorija</h1>
<p class="muted">Your memory files, as agents record them. Live — the feed and the file below update on their own.</p>

<div id="feed"></div>
<div id="empty" class="muted" hidden>
  No changes recorded yet. As agent sessions create and edit memory files,
  every change shows up here automatically.
</div>

<div id="content">
  <p id="file-title" class="muted"></p>
  <div id="file-body"></div>
</div>

<script>
"use strict";

var feed = document.getElementById("feed");
var empty = document.getElementById("empty");
var fileTitle = document.getElementById("file-title");
var fileBody = document.getElementById("file-body");

// The file to show comes from the URL (`/?path=<rel>`), so a refresh or a
// bookmark returns to the same file; empty shows the most recently changed.
function selectedPath() {
  return new URLSearchParams(location.search).get("path") || "";
}

function select(path) {
  var url = path ? "/?path=" + encodeURIComponent(path) : "/";
  history.pushState({}, "", url);
  showFile(path);
  markSelected(path);
}

function markSelected(path) {
  var rows = feed.querySelectorAll(".row");
  for (var i = 0; i < rows.length; i++) {
    rows[i].classList.toggle("selected", rows[i].dataset.path === path);
  }
}

function renderFeed(changes) {
  feed.textContent = "";
  empty.hidden = changes.length > 0;
  changes.forEach(function (change) {
    var row = document.createElement("div");
    row.className = "row";
    row.dataset.path = change.path;

    var when = document.createElement("span");
    when.className = "when";
    when.textContent = change.recorded_at.slice(0, 10) + " " + change.recorded_at.slice(11, 19);
    row.appendChild(when);

    var file = document.createElement("span");
    file.className = "file";
    file.textContent = change.path;
    row.appendChild(file);

    var cause = document.createElement("span");
    cause.className = "cause";
    cause.textContent = change.cause;
    row.appendChild(cause);

    var size = document.createElement("span");
    size.className = "size";
    var added = document.createElement("span");
    added.className = "added";
    added.textContent = "+" + change.added;
    var removed = document.createElement("span");
    removed.className = "removed";
    removed.textContent = " -" + change.removed;
    size.appendChild(added);
    size.appendChild(removed);
    row.appendChild(size);

    row.addEventListener("click", function () { select(change.path); });
    feed.appendChild(row);
  });
}

function refreshFeed() {
  return fetch("/api/changes")
    .then(function (response) { return response.json(); })
    .then(function (data) {
      if (data.error) { showFileError(data.error); return; }
      renderFeed(data.changes);
      markSelected(selectedPath());
    })
    .catch(function (error) { showFileError("Cannot reach the viewer: " + error); });
}

function showFile(path) {
  if (!path) {
    // No file selected: show the most recently changed one.
    var first = feed.querySelector(".row");
    if (first) {
      showFile(first.dataset.path);
      markSelected(first.dataset.path);
    } else {
      fileTitle.textContent = "";
      fileBody.textContent = "";
    }
    return;
  }
  fileTitle.textContent = "Loading " + path + "…";
  fetch("/api/file?path=" + encodeURIComponent(path))
    .then(function (response) { return response.json().then(function (data) {
      return { status: response.status, data: data };
    }); })
    .then(function (result) {
      if (result.status !== 200 || result.data.error) {
        fileTitle.textContent = "";
        fileBody.innerHTML = "";
        var message = document.createElement("p");
        message.className = "error";
        message.textContent = result.data.error
          || "The path " + path + " does not exist.";
        fileBody.appendChild(message);
        return;
      }
      fileTitle.textContent = result.data.path
        + (result.data.latest_version ? " · v" + result.data.latest_version : "");
      fileBody.innerHTML = result.data.html;
    })
    .catch(function (error) { showFileError("Cannot reach the viewer: " + error); });
}

function showFileError(message) {
  fileTitle.textContent = "";
  fileBody.innerHTML = "";
  var note = document.createElement("p");
  note.className = "error";
  note.textContent = message;
  fileBody.appendChild(note);
}

window.addEventListener("popstate", function () {
  refreshFeed();
  showFile(selectedPath());
});

// Live updates: the server pushes the fresh feed whenever the version store
// moves; the displayed file follows if it changed or was not picked yet.
var eventSource = new EventSource("/api/events");
eventSource.addEventListener("changes", function (event) {
  var data = JSON.parse(event.data);
  if (data.error) { return; }
  var before = feed.querySelector(".row") && feed.querySelector(".row").dataset.path;
  renderFeed(data.changes);
  var current = selectedPath();
  if (!current) {
    showFile("");
    markSelected("");
  } else {
    markSelected(current);
    var latest = data.changes.length && data.changes[0].path;
    if (latest === current || !before) { showFile(current); }
  }
});

refreshFeed();
showFile(selectedPath());
</script>
</body>
</html>
