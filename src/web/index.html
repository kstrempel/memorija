<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memorija</title>
<link rel="stylesheet" href="/app.css">
<script src="/prefs.js"></script>
</head>
<body>
<header class="site-header">
  <h1 class="brand"><span class="tilde" aria-hidden="true">~</span><span class="sep" aria-hidden="true">/</span>memorija</h1>
  <nav class="screens" aria-label="Screens">
    <a href="/" data-screen="changes">Changes</a>
    <a href="/files" data-screen="files">Files</a>
    <a href="/file" data-screen="file">Reader</a>
  </nav>
  <button type="button" class="settings-open" id="settings-open" aria-label="Settings" aria-haspopup="dialog" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
</header>
<noscript>
  <p class="notice">The memorija viewer needs JavaScript to show your memory files.</p>
</noscript>
<p id="notice" class="notice error" hidden></p>
<main id="screen"></main>
<dialog class="settings" id="settings" aria-labelledby="settings-title">
  <header class="settings-head">
    <h2 class="settings-title" id="settings-title">Settings</h2>
    <button type="button" class="settings-close" data-settings-close aria-label="Close settings" title="Close settings">&#10005;</button>
  </header>
  <div class="settings-body">
    <fieldset class="settings-section">
      <legend class="settings-label">Appearance</legend>
      <div class="theme-control">
        <button type="button" data-theme-choice="light" aria-pressed="false" title="Light"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><span>Light</span></button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5Z"/></svg><span>Dark</span></button>
        <button type="button" data-theme-choice="system" aria-pressed="false" title="System"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12"/><path d="M8 20h8M12 16v4"/></svg><span>System</span></button>
      </div>
    </fieldset>
    <section class="settings-section">
      <h3 class="settings-label">Page width</h3>
      <input type="range" class="width-control" id="page-width" min="40" max="100" step="1" value="55" aria-label="Page width" aria-valuetext="55% of the window" title="Page width">
      <div class="width-scale">
        <span>40%</span>
        <span class="width-value" id="width-value">55% of the window</span>
        <span>100%</span>
      </div>
    </section>
  </div>
  <footer class="settings-foot">
    <span class="settings-note">Saved in this browser</span>
    <button type="button" class="settings-done" data-settings-close>Close</button>
  </footer>
</dialog>
<script src="/app.js"></script>
</body>
</html>
