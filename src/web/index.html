<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memorija</title>
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
</head>
<body>
<header class="site-header">
  <h1 class="brand"><span class="tilde" aria-hidden="true">~</span><span class="sep" aria-hidden="true">/</span>memorija</h1>
  <nav class="screens" aria-label="Screens">
    <a href="/" data-screen="changes">Changes</a>
    <a href="/files" data-screen="files">Files</a>
    <a href="/file" data-screen="file">Reader</a>
  </nav>
  <div class="appearance">
    <span id="theme-label" class="theme-label" aria-hidden="true">THEME:</span>
    <div class="theme-control" role="group" aria-label="Appearance">
      <button type="button" data-theme-choice="light" aria-label="Light" aria-pressed="false" title="Light"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
      <button type="button" data-theme-choice="dark" aria-label="Dark" aria-pressed="false" title="Dark"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5Z"/></svg></button>
      <button type="button" data-theme-choice="system" aria-label="System" aria-pressed="false" title="System"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12"/><path d="M8 20h8M12 16v4"/></svg></button>
    </div>
  </div>
</header>
<noscript>
  <p class="notice">The memorija viewer needs JavaScript to show your memory files.</p>
</noscript>
<p id="notice" class="notice error" hidden></p>
<main id="screen"></main>
<script src="/app.js"></script>
</body>
</html>
